<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스파이크 ③ 처리 시간 측정</title>
<style>
 body{font-family:system-ui;margin:16px;background:#0f171c;color:#e8eef0;-webkit-text-size-adjust:100%}
 h2{margin:0 0 4px;font-size:18px} p{margin:4px 0;color:#9fb3bd;font-size:13px}
 button{font-size:16px;padding:10px 14px;margin:4px 4px 4px 0;border-radius:8px;border:1px solid #2c4049;background:#1a262c;color:#e8eef0}
 button:disabled{opacity:.4}
 table{border-collapse:collapse;width:100%;margin-top:12px;font-size:13px}
 th,td{border:1px solid #2c4049;padding:6px 8px;text-align:right;white-space:nowrap}
 th:first-child,td:first-child{text-align:left}
 #status{margin-top:10px;padding:8px;background:#1a262c;border-radius:8px;font-size:13px;min-height:20px}
 #env{font-size:12px;color:#7e959f;margin-top:10px;word-break:break-all}
</style></head>
<body>
<h2>스파이크 ③ — 이 기기에서 처리 시간</h2>
<p>앱과 같은 경로(디코드 → 22.05 kHz 리샘플 → 워커에서 pYIN)로 돌려 잰다.</p>
<div id="buttons"></div>
<p>또는 이 기기에 있는 파일로: <input type="file" id="pick" accept="audio/*,video/*"></p>
<div id="status">대기 중</div>
<table id="tbl"><thead><tr>
 <th>파일</th><th>길이</th><th>내려받기</th><th>디코드+리샘플</th><th>음높이 추적</th><th>합계</th><th>실시간 배수</th>
</tr></thead><tbody></tbody></table>
<button id="copy">결과 복사</button>
<div id="env"></div>
<script type="module" src="./bench.ts"></script>
</body></html>
